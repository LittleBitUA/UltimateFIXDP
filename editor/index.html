<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UltimateFIXDP · Quest editor</title>
<style>
:root{
  --bg:#d9dade; --panel:#f7f7f9; --panel2:#f0f0f3; --head:#e6e7ec; --line:#c9cbd2; --field:#ffffff; --edge:#c3c5cc;
  --text:#1c1d22; --dim:#5c5f6a; --accent:#2f6fdb; --accent2:var(--accent); --ok:#2e9a48; --bad:#c9442e; --warn:#a56a00;
  --btn-edge:#c3c5cc; --btn-hover:#d9dbe2; --btn-active:#cdcfd7; --canvas:#e9ebee; --grid:#d3d6dd; --grid0:#aeb2bc; --grid-text:#5f6370;
  --node:#ffffff; --node-end:#e4e5ea; --mark-edge:#1c1d22; --toast:#ffffff;
  --r:4px; --font:13px/1.35 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#1d1d1f; --panel:#2a2a2d; --panel2:#323236; --head:#3a3a3f; --line:#18181a; --field:#1b1b1d; --edge:#111113;
  --text:#dcdcde; --dim:#9a9aa1; --accent:#5b8fd6; --ok:#6cc24a; --bad:#e0685f; --warn:#e0b341;
  --btn-edge:#1f1f22; --btn-hover:#4a4a50; --btn-active:#2f2f33; --canvas:#232326; --grid:#2c2c30; --grid0:#4a4a50; --grid-text:#8a8a90;
  --node:#34343a; --node-end:#2f2f33; --mark-edge:#111113; --toast:#101012;
}
:root[data-theme=game]{
  --bg:#120d0e; --panel:#211819; --panel2:#281c1e; --head:#33242a; --line:#0a0607; --field:#160f10; --edge:#0a0607;
  --text:#efe6d8; --dim:#b5a595; --accent:#e5484d; --ok:#7fd28a; --bad:#f0a08a; --warn:#f0b35a;
  --btn-edge:#0a0607; --btn-hover:#4a3438; --btn-active:#2c1f21; --canvas:#191213; --grid:#261b1d; --grid0:#4a383a; --grid-text:#a39384;
  --node:#2c1f21; --node-end:#211819; --mark-edge:#0a0607; --toast:#0c0808;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--font);overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;width:100vw;height:100vh;grid-template-rows:34px minmax(0,1fr) 26px;grid-template-columns:260px minmax(0,1fr) 340px;gap:2px;background:var(--line)}
#top{grid-column:1/4;background:var(--panel);display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden}
#top .brand{font-weight:600;letter-spacing:.2px;margin-right:6px}
#top .brand b{color:var(--accent)}
#top .sp{flex:1}
.btn{background:var(--head);border:1px solid var(--btn-edge);border-radius:var(--r);padding:3px 10px;cursor:pointer;min-height:24px}
.btn:hover{background:var(--btn-hover)}
.btn:active{background:var(--btn-active)}
.btn.pri{background:var(--accent2);border-color:transparent;color:#fff}
.btn.pri:hover{background:var(--accent2);filter:brightness(1.12)}
.btn.go{background:#3f6d2f;border-color:#2c4d21;color:#fff}
.btn.go:hover{background:#4d8539}
.btn.stop{background:#7a3330;border-color:#572422;color:#fff}
.btn.stop:hover{background:#934039}
.btn.sm{padding:1px 7px;min-height:20px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:5px;vertical-align:-1px}
.dot.on{background:var(--ok)} .dot.half{background:var(--warn)}
.pane{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0}
.phead{background:var(--head);padding:5px 8px;font-weight:600;display:flex;align-items:center;gap:6px;flex:none}
.phead .sp{flex:1}
.pbody{overflow:auto;flex:1;min-height:0}
#center{display:grid;grid-template-rows:minmax(0,1fr) 2px 190px;grid-template-columns:minmax(0,1fr);background:var(--line);min-width:0;min-height:0}
#steps{list-style:none;margin:0;padding:4px}
#steps li{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:var(--r);cursor:pointer}
#steps li:hover{background:var(--panel2)}
#steps li.sel{background:var(--accent2);color:#fff}
#steps li.run{box-shadow:inset 3px 0 0 var(--ok)}
#steps .n{color:var(--dim);width:18px;text-align:right;font-variant-numeric:tabular-nums}
#steps li.sel .n{color:#eef3fc}
#steps .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:18px;height:18px;flex:none;border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#111}
.k0{background:#e8a33d}.k1{background:#d9c85a}.k2{background:#5fb0e8}.k3{background:#b58ae6}.kq{background:#9a9aa0}
canvas{display:block;width:100%;height:100%;background:var(--canvas);cursor:grab}
canvas.drag{cursor:grabbing}
#mapwrap{position:relative;flex:1;min-height:0}
#maphint{position:absolute;left:8px;bottom:6px;color:var(--dim);font-size:12px;pointer-events:none}
#flow{width:100%;height:100%;display:block;background:var(--canvas)}
#flowwrap{overflow:auto;flex:1;min-height:0}
.sec{border-bottom:1px solid var(--line)}
.sec>h4{margin:0;padding:6px 8px;background:var(--panel2);font-size:12px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.sec>h4:before{content:"▾";color:var(--dim);font-size:10px}
.sec.shut>h4:before{content:"▸"}
.sec.shut>.rows{display:none}
.rows{padding:6px 8px 8px;display:grid;grid-template-columns:118px 1fr;gap:5px 8px;align-items:center}
.rows label{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .wide{grid-column:1/3}
.rows .note{grid-column:1/3;color:var(--dim);font-size:12px;line-height:1.35;user-select:text}
input[type=text],input[type=number],select,textarea{background:var(--field);border:1px solid var(--edge);border-radius:var(--r);padding:3px 6px;width:100%;min-width:0;user-select:text}
#maphint{background:var(--panel);padding:2px 7px;border-radius:var(--r);opacity:.9}
#settings{position:fixed;right:8px;top:40px;width:320px;background:var(--panel);border:1px solid var(--edge);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;display:none}
#settings.open{display:block}
#settings h4{margin:0;padding:8px 10px;background:var(--head);border-radius:6px 6px 0 0;font-size:13px}
#settings .rows{grid-template-columns:110px 1fr}
input[type=color]{width:44px;height:26px;padding:1px;background:var(--field);border:1px solid var(--edge);border-radius:var(--r)}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent2);outline-offset:0}
textarea{resize:vertical;min-height:44px;line-height:1.35}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.hrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.cnt{color:var(--dim);font-size:11px;text-align:right}
.cnt.over{color:var(--bad)}
#status{grid-column:1/4;background:var(--panel);display:flex;align-items:center;gap:14px;padding:0 8px;color:var(--dim);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#status b{color:var(--text);font-weight:500}
#status .sp{flex:1}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--toast);border:1px solid var(--edge);box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:6px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70vw}
#toast.show{opacity:1}
#toast.bad{border-color:var(--bad)}
.empty{color:var(--dim);padding:18px 12px;line-height:1.5}
.tools{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-top:1px solid var(--line);flex:none}
.legend{display:flex;gap:12px;color:var(--dim);font-size:12px;font-weight:400}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
@media (max-width:1100px){#app{grid-template-columns:210px minmax(0,1fr) 300px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="brand">Ultimate<b>FIX</b>DP · <span data-t="Редактор квестів|Quest editor"></span></span>
    <label data-t="Слот|Slot"></label>
    <select id="slot" style="width:150px"></select>
    <button class="btn pri" id="save" data-t="Зберегти|Save" title="Ctrl+S"></button>
    <button class="btn" id="reload" data-t="Перечитати|Reload"></button>
    <span style="width:10px"></span>
    <button class="btn go" id="run" data-t="▶ Запустити|▶ Run"></button>
    <button class="btn" id="restart" data-t="⟲ З першого кроку|⟲ From step 1"></button>
    <button class="btn stop" id="stop" data-t="■ Зупинити|■ Stop"></button>
    <span class="sp"></span>
    <button class="btn" id="import" data-t="Імпорт файлу|Import file"></button>
    <button class="btn" id="export" data-t="Експорт файлу|Export file"></button>
    <button class="btn" id="setbtn" data-t="Налаштування|Settings"></button>
    <button class="btn" id="lang">EN</button>
    <input type="file" id="file" accept=".ini,.txt" hidden>
  </div>

  <div class="pane">
    <div class="phead"><span data-t="Квест і кроки|Quest and steps"></span><span class="sp"></span><span id="dirty" style="color:var(--warn)"></span></div>
    <div class="pbody"><ul id="steps"></ul></div>
    <div class="tools">
      <button class="btn sm" id="add0" data-t="+ Розмова|+ Talk"></button>
      <button class="btn sm" id="add1" data-t="+ Репліка|+ Line"></button>
      <button class="btn sm" id="add2" data-t="+ Місце|+ Place"></button>
      <button class="btn sm" id="add3" data-t="+ Час|+ Time"></button>
    </div>
    <div class="tools">
      <button class="btn sm" id="up">↑</button><button class="btn sm" id="down">↓</button>
      <button class="btn sm" id="dup" data-t="Дублювати|Duplicate"></button>
      <button class="btn sm" id="del" data-t="Видалити|Delete"></button>
    </div>
  </div>

  <div id="center">
    <div class="pane">
      <div class="phead"><span data-t="Мапа (вид згори)|Map (top view)"></span><span class="sp"></span>
        <button class="btn sm" id="fit" data-t="Показати все|Fit all"></button>
        <button class="btn sm" id="follow" data-t="До Йорка|To York"></button></div>
      <div id="mapwrap"><canvas id="map"></canvas><div id="maphint" data-t="Колесо — масштаб, тягнути — рухати, клік по мітці — вибрати крок|Wheel zooms, drag pans, click a marker to select its step"></div></div>
    </div>
    <div></div>
    <div class="pane">
      <div class="phead"><span data-t="Хід квесту|Quest flow"></span><span class="sp"></span>
        <span class="legend"><span><i style="background:var(--ok)"></i><span data-t="далі / перша відповідь|next / first answer"></span></span><span><i style="background:var(--bad)"></i><span data-t="друга відповідь|second answer"></span></span></span></div>
      <div id="flowwrap"><svg id="flow"></svg></div>
    </div>
  </div>

  <div class="pane">
    <div class="phead"><span data-t="Властивості|Properties"></span></div>
    <div class="pbody" id="props"></div>
  </div>

  <div id="status">
    <span><span class="dot" id="dot"></span><b id="conn"></b></span>
    <span><span data-t="Йорк|York"></span> <b id="pos">—</b></span>
    <span><span data-t="зона|zone"></span> <b id="zone">—</b></span>
    <span><span data-t="час|time"></span> <b id="clock">—</b></span>
    <span><span data-t="квест|quest"></span> <b id="qstate">—</b></span>
    <span class="sp"></span>
    <span id="ver"></span>
  </div>
</div>
<div id="settings">
  <h4 data-t="Налаштування редактора|Editor settings"></h4>
  <div class="rows">
    <label for="setTheme" data-t="Тема|Theme"></label><select id="setTheme"></select>
    <label for="setAccent" data-t="Колір акценту|Accent colour"></label><div class="hrow"><input type="color" id="setAccent"><button class="btn sm" id="setAccentOff" data-t="Як у темі|As the theme"></button></div>
    <label for="setMap" data-t="Мапа гри|Game map"></label><select id="setMap"></select>
    <div class="note" data-t="Мапу Грінвейла редактор бере з файлів гри, поки гра запущена. Налаштування зберігаються в цьому браузері.|The editor takes the map of Greenvale from the game's files while the game runs. The settings are kept in this browser."></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
// ---------- language ----------
// the button's choice is kept; before that the page follows the language of the mod's menu, and until the game answers
// it is Ukrainian for a Ukrainian browser and English for any other
let langPicked = null; try { langPicked = localStorage.getItem("ufx.lang"); } catch (e) {}
let EN = langPicked ? langPicked === "en" : (navigator.language || "en").slice(0, 2) !== "uk";
const T = (uk, en) => (EN ? en : uk);
function applyLang() {
  document.documentElement.lang = EN ? "en" : "uk";
  document.querySelectorAll("[data-t]").forEach(e => { const [u, n] = e.dataset.t.split("|"); e.textContent = EN ? n : u; });
  $("lang").textContent = EN ? "UA" : "EN";
}
const $ = id => document.getElementById(id);

// ---------- the quest ----------
const KIND = () => [T("Розмова з вибором", "Talk with a choice"), T("Репліка", "A line"), T("Дійти до місця", "Reach a place"), T("Дочекатися години", "Wait for an hour")];
const KLET = ["?", "“", "◎", "◷"];
const STEP_NUM = ["Kind", "Resident", "Placed", "X", "Y", "Z", "Yaw", "MotionSet", "Motion", "Radius", "Zone", "Hour", "NextYes", "NextNo", "GiveItem", "GiveCount", "Money", "Car", "SetHour", "Weather", "Teleport", "TX", "TY", "TZ", "TYaw", "CarPlace", "CarX", "CarY", "CarZ", "CarYaw"];
const STEP_TXT = ["Title", "Line", "Question", "Yes", "No", "AfterYes", "AfterNo"];
const LIMIT = { Title: 95, Line: 199, Question: 199, Yes: 39, No: 39, AfterYes: 199, AfterNo: 199, Name: 63, Author: 63, Banner: 95, EndText: 199 };
const MAXSTEPS = 16;
function newStep(kind) {
  const s = { Kind: kind, Resident: 6, Placed: 0, X: 0, Y: 0, Z: 0, Yaw: 0, MotionSet: 1, Motion: 0, Radius: 15, Zone: -1, Hour: 12, NextYes: 0, NextNo: 0,
    GiveItem: 0, GiveCount: 1, Money: 0, Car: 0, SetHour: -1, Weather: 0, Teleport: 0, TX: 0, TY: 0, TZ: 0, TYaw: 0, CarPlace: 0, CarX: 0, CarY: 0, CarZ: 0, CarYaw: 0,
    Title: "", Line: "", Question: "", Yes: "", No: "", AfterYes: "", AfterNo: "" };
  if (kind === 0) { s.Yes = T("Так", "Yes"); s.No = T("Ні", "No"); }
  return s;
}
function newQuest() { return { Name: "", Author: "", Banner: "", EndText: "", steps: [] }; }
let Q = newQuest(), sel = -1 /* -1 = the quest itself */, slot = 1, dirty = false, lists = { residents: [], items: [], cars: [] }, live = null, online = false;

function parseIni(text) {
  const q = newQuest(), steps = {}; let sec = "", count = -1, legacy = false;
  for (let line of text.replace(/^﻿/, "").split(/\r?\n/)) {
    line = line.trim();
    if (!line || line[0] === ";") continue;
    const m = /^\[(.+)\]$/.exec(line);
    if (m) { sec = m[1].trim().toLowerCase(); continue; }
    const eq = line.indexOf("="); if (eq < 0) continue;
    const key = line.slice(0, eq).trim(), val = line.slice(eq + 1).trim(), lk = key.toLowerCase();
    if (sec === "mission") {
      if (lk === "steps") count = parseInt(val) || 0;
      else for (const k of ["Name", "Author", "Banner", "EndText"]) if (k.toLowerCase() === lk) q[k] = val;
    } else {
      let n = 0;
      const sm = /^step(\d+)$/.exec(sec);
      if (sm) n = parseInt(sm[1]);
      else if (sec === "actor" || sec === "talk") { n = 1; legacy = true; }
      if (n < 1 || n > MAXSTEPS) continue;
      const s = steps[n] || (steps[n] = newStep(0));
      if (!steps[n].__seen) { s.Yes = ""; s.No = ""; s.__seen = 1; }
      for (const k of STEP_NUM) if (k.toLowerCase() === lk) s[k] = parseInt(val) || 0;
      for (const k of STEP_TXT) if (k.toLowerCase() === lk) s[k] = val;
    }
  }
  if (count < 0) count = legacy ? 1 : 0;
  for (let i = 1; i <= Math.min(count, MAXSTEPS); ++i) { const s = steps[i] || newStep(0); delete s.__seen; q.steps.push(s); }
  return q;
}
const clean = s => String(s).replace(/[\r\n]+/g, " ").trim();
function toIni(q) {
  const L = ["; " + T("Квест редактора UltimateFIXDP. Зручніше редагувати в редакторі: F10 -> Редактор місій -> Відкрити редактор квестів.", "A quest of the UltimateFIXDP editor. Easier to edit in the editor: F10 -> Mission editor -> Open the quest editor."),
    "[Mission]", "Name=" + clean(q.Name), "Author=" + clean(q.Author), "Banner=" + clean(q.Banner), "EndText=" + clean(q.EndText), "Steps=" + q.steps.length, ""];
  q.steps.forEach((s, i) => {
    L.push("[Step" + (i + 1) + "]");
    for (const k of STEP_NUM) L.push(k + "=" + (parseInt(s[k]) || 0));
    for (const k of STEP_TXT) L.push(k + "=" + clean(s[k]));
    L.push("");
  });
  return "﻿" + L.join("\r\n");
}
function decode(buf) {
  const b = new Uint8Array(buf);
  if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder("utf-16le").decode(b.subarray(2));
  return new TextDecoder("utf-8").decode(b);
}

// ---------- the game ----------
async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) { const e = new Error(await r.text()); e.status = r.status; throw e; }
  return r;
}
function toast(msg, bad) { const t = $("toast"); t.textContent = msg; t.className = "show" + (bad ? " bad" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ""), bad ? 5000 : 2200); }
function setDirty(v) { dirty = v; $("dirty").textContent = v ? T("не збережено", "unsaved") : ""; }
async function loadSlot(n) {
  slot = n; sel = -1;
  try { Q = parseIni(decode(await (await api("/api/mission?slot=" + n)).arrayBuffer())); }
  catch (e) { Q = newQuest(); if (e.status !== 404) toast(T("Гра не відповідає: файл не прочитано", "The game does not answer: the file was not read"), true); }
  setDirty(false); renderAll(); fit();
}
async function save() {
  for (const s of Q.steps) for (const k of STEP_TXT) if (clean(s[k]).length > LIMIT[k]) { toast(T("Задовгий текст у кроці: скоротіть його", "A text of a step is too long: shorten it"), true); return false; }
  try {
    await api("/api/mission?slot=" + slot, { method: "POST", body: new TextEncoder().encode(toIni(Q)) });
    setDirty(false); toast(T("Збережено у missions\\mission" + slot + ".ini", "Saved to missions\\mission" + slot + ".ini")); fillSlots(); return true;
  } catch (e) { toast(T("Не збережено: гра не відповідає. Скористайтесь «Експорт файлу».", "Not saved: the game does not answer. Use \"Export file\"."), true); return false; }
}
async function cmd(q) { try { await api("/api/cmd?" + q, { method: "POST" }); return true; } catch (e) { toast(T("Гра не відповідає", "The game does not answer"), true); return false; } }
async function poll() {
  try { live = await (await api("/api/state")).json(); online = true; } catch (e) { online = false; live = null; }
  if (online && SET.map !== "grid") loadTiles();
  if (online && !langPicked && typeof live.lang === "number" && EN !== (live.lang === 1)) { EN = live.lang === 1; applyLang(); renderAll(); setDirty(dirty); }
  const d = $("dot");
  d.className = "dot" + (online ? (live.inGame ? " on" : " half") : "");
  $("conn").textContent = !online ? T("гри немає", "no game") : live.inGame ? (live.free ? T("гра на зв'язку", "game connected") : T("у грі сцена або меню", "a scene or a menu in the game")) : T("гра в головному меню", "the game is in its main menu");
  $("pos").textContent = live && live.inGame ? [live.x, live.y, live.z].map(v => Math.round(v / 1000)).join("  ") : "—";
  $("zone").textContent = live && live.inGame ? live.zone : "—";
  $("clock").textContent = live && live.hour >= 0 ? String(live.hour).padStart(2, "0") + ":" + String(live.minute).padStart(2, "0") : "—";
  $("qstate").textContent = live ? (live.running ? T("слот ", "slot ") + live.slot + " · " + live.state : live.state) : "—";
  $("ver").textContent = live ? "UltimateFIXDP " + live.version : "";
  document.querySelectorAll("#steps li").forEach((li, i) => li.classList.toggle("run", !!(live && live.running && live.slot === slot && live.step === i)));
  drawMap();
  if (online && !lists.residents.length) loadLists();
}
async function loadLists() { try { lists = await (await api("/api/lists")).json(); renderProps(); } catch (e) {} }
async function fillSlots() {
  const s = $("slot"), keep = slot; s.innerHTML = "";
  for (let i = 1; i <= 9; ++i) { const o = document.createElement("option"); o.value = i; o.textContent = i + (i === keep && Q.Name ? " · " + Q.Name : ""); s.appendChild(o); }
  s.value = keep;
}

// ---------- outliner ----------

// ---------- flow graph ----------
function target(i, key) { const s = Q.steps[i], v = s[key]; if (v < 0) return Q.steps.length; if (v === 0) return i + 1; return v - 1; }
function drawFlow() {

  const ns = "http://www.w3.org/2000/svg", mk = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  svg.innerHTML = '<defs><marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="' + css("--ok") + '"/></marker><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="' + css("--bad") + '"/></marker></defs>';
  const x = i => X0 + i * (W + GAP);

    const col = red ? css("--bad") : css("--ok"), mid = red ? "ar" : "ag";
    let d;
    if (b === a + 1 && !red) d = `M${x(a) + W},${Y0 + H / 2} L${x(b) - 2},${Y0 + H / 2}`;
    else { const up = !red, y = up ? Y0 : Y0 + H, lift = Math.min(52, 22 + Math.abs(b - a) * 9) * (up ? -1 : 1), x1 = x(a) + W / 2 + (red ? 14 : -14), x2 = x(b) + W / 2 + (b <= a ? (red ? -14 : 14) : (red ? -14 : -30));
      d = `M${x1},${y} C${x1},${y + lift} ${x2},${y + lift} ${x2},${y + (up ? -2 : 2)}`; }
    svg.appendChild(mk("path", { d, fill: "none", stroke: col, "stroke-width": 1.6, "marker-end": `url(#${mid})`, opacity: .9 }));
  };
  for (let i = 0; i < n; ++i) { edge(i, Math.min(target(i, "NextYes"), n), false); if (Q.steps[i].Kind === 0) edge(i, Math.min(target(i, "NextNo"), n), true); }
  const colors = ["#e8a33d", "#d9c85a", "#5fb0e8", "#b58ae6"];
  for (let i = 0; i <= n; ++i) {
    const end = i === n, g = mk("g", { style: end ? "" : "cursor:pointer" });
    const run = live && live.running && live.slot === slot && live.step === i + 1;
    g.appendChild(mk("rect", { x: x(i), y: Y0, width: end ? 90 : W, height: H, rx: 5, fill: end ? css("--node-end") : css("--node"), stroke: !end && i === sel ? css("--accent") : run ? css("--ok") : css("--edge"), "stroke-width": !end && (i === sel || run) ? 2 : 1 }));
    if (!end) g.appendChild(mk("rect", { x: x(i), y: Y0, width: 5, height: H, rx: 2, fill: colors[Q.steps[i].Kind] }));
    const t1 = mk("text", { x: x(i) + 12, y: Y0 + 17, fill: css("--dim"), "font-size": 11 }); t1.textContent = end ? "" : (i + 1) + " · " + KIND()[Q.steps[i].Kind];
    const t2 = mk("text", { x: x(i) + 12, y: Y0 + (end ? 27 : 34), fill: css("--text"), "font-size": 12 });
    let name = end ? T("Кінець", "The end") : stepName(Q.steps[i], i); if (name.length > 20) name = name.slice(0, 19) + "…"; t2.textContent = name;
    g.appendChild(t1); g.appendChild(t2);
    if (!end) g.onclick = () => select(i);

  }
}

}

// ---------- the game's map: 64 tiles (DDS, DXT1, 1024 px) from the mod's server, drawn at half size into one picture ----------
const TILES = { cv: null, out: null, ready: 0, state: 0, timer: 0 };
function ddsImage(b) {

  if (b.length < 128 || v.getUint32(0, true) !== 0x20534444 || v.getUint32(84, true) !== 0x31545844) throw new Error("not a DXT1 picture");

  let o = 128;
  for (let by = 0; by < h; by += 4) for (let bx = 0; bx < w; bx += 4, o += 8) {
    const c0 = b[o] | b[o + 1] << 8, c1 = b[o + 2] | b[o + 3] << 8;
    c[0] = (c0 >> 11) * 255 / 31; c[1] = (c0 >> 5 & 63) * 255 / 63; c[2] = (c0 & 31) * 255 / 31;
    c[4] = (c1 >> 11) * 255 / 31; c[5] = (c1 >> 5 & 63) * 255 / 63; c[6] = (c1 & 31) * 255 / 31;
    for (let k = 0; k < 3; k++) if (c0 > c1) { c[8 + k] = (2 * c[k] + c[4 + k]) / 3; c[12 + k] = (c[k] + 2 * c[4 + k]) / 3; } else { c[8 + k] = (c[k] + c[4 + k]) / 2; c[12 + k] = 0; }
    for (let y = 0; y < 4; y++) { let bits = b[o + 4 + y], p = ((by + y) * w + bx) * 4;
      for (let x = 0; x < 4; x++, bits >>= 2, p += 4) { const i = (bits & 3) * 4; px[p] = c[i]; px[p + 1] = c[i + 1]; px[p + 2] = c[i + 2]; px[p + 3] = 255; } }
  }

}
function retint() {
  if (!TILES.cv || !TILES.ready) return;
  clearTimeout(TILES.timer);
  TILES.timer = setTimeout(() => {
    if (SET.map !== "tone") { TILES.out = null; drawMap(); return; }
    const out = TILES.out || document.createElement("canvas"); out.width = out.height = TILES.cv.width;
    const g = out.getContext("2d");
    g.filter = SET.theme === "light" ? "grayscale(55%) brightness(122%) contrast(78%)" : SET.theme === "game" ? "grayscale(85%) sepia(40%) brightness(40%)" : "grayscale(70%) brightness(45%)";
    g.drawImage(TILES.cv, 0, 0); TILES.out = out; drawMap();
  }, 200);
}
async function loadTiles() {
  if (TILES.state) return; TILES.state = 1;
  const big = document.createElement("canvas"); big.width = big.height = 4096; const g = big.getContext("2d");
  const one = document.createElement("canvas"); one.width = one.height = 1024; const og = one.getContext("2d");
  TILES.cv = big;
  let next = 0, failed = 0;
  const work = async () => {
    while (next < 64 && failed < 3) {
      const n = next++;
      try {
        const r = await fetch("/api/maptile?n=" + n); if (!r.ok) throw new Error(await r.text());
        const img = ddsImage(new Uint8Array(await r.arrayBuffer()));
        if (one.width !== img.width) { one.width = img.width; one.height = img.height; }
        og.putImageData(img, 0, 0); g.drawImage(one, (n & 7) * 512, (n >> 3) * 512, 512, 512);
        TILES.ready++; retint();
      } catch (e) { if (++failed === 3 && !TILES.ready) { TILES.state = 0; TILES.cv = null; toast(T("Мапу гри не вдалося прочитати: ", "The game's map could not be read: ") + e.message, true); TILES.state = 2; } }
    }
  };
  await Promise.all([work(), work()]);
}

function sizeMap() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = Math.max(10, r.width * d); cv.height = Math.max(10, r.height * d); drawMap(); }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toScr = (wx, wz) => [cv.width / 2 + (wx - view.x) * view.s * (devicePixelRatio || 1), cv.height / 2 + (wz - view.z) * view.s * (devicePixelRatio || 1)];
function points() {
  const p = [];
  Q.steps.forEach((s, i) => {
    if (s.Kind <= 1 && s.Placed) p.push({ i, x: s.X / 1000, z: s.Z / 1000, k: s.Kind, yaw: s.Yaw / 1000 });
    if (s.Kind === 2) p.push({ i, x: s.X / 1000, z: s.Z / 1000, k: 2, r: s.Radius * 4 });
    if (s.Teleport) p.push({ i, x: s.TX / 1000, z: s.TZ / 1000, k: 9 });
    if (s.Car && s.CarPlace === 2) p.push({ i, x: s.CarX / 1000, z: s.CarZ / 1000, k: 8 });
  });
  return p;
}
function fit() {
  const p = points(); if (live && live.inGame) p.push({ x: live.x / 1000, z: live.z / 1000 });
  if (!p.length) { view.x = 0; view.z = 0; view.s = 0.02; drawMap(); return; }
  const xs = p.map(a => a.x), zs = p.map(a => a.z), x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
  view.x = (x0 + x1) / 2; view.z = (z0 + z1) / 2;
  const r = cv.getBoundingClientRect(), span = Math.max(x1 - x0, z1 - z0, 200);
  view.s = Math.min(r.width, r.height) * 0.7 / span; drawMap();
}
function drawMap() {
  const d = devicePixelRatio || 1, w = cv.width, h = cv.height; if (!w) return;
  const cGrid = css("--grid"), cGrid0 = css("--grid0"), cText = css("--text"), cOk = css("--ok"), cEdge = css("--mark-edge"), cAccent = css("--accent");
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = css("--canvas"); cx.fillRect(0, 0, w, h);
  if (TILES.ready && SET.map !== "grid") {  // the game's own map: 8 x 8 tiles of 10000 units; column = (x + 40000) / 10000, row = (z + 40000) / 10000 (FUN_005E16F0), so z grows down the screen
    const [mx, my] = toScr(-40000, -40000), size = 80000 * view.s * d;
    cx.imageSmoothingEnabled = true; cx.drawImage(TILES.out || TILES.cv, mx, my, size, size);
  }
  const onMap = TILES.ready && SET.map !== "grid";
  // grid
  let step = 10; while (step * view.s * d < 38) step *= step.toString()[0] === "2" ? 2.5 : 2;
  cx.lineWidth = 1; cx.font = 11 * d + "px Segoe UI, sans-serif"; cx.fillStyle = css("--grid-text"); cx.globalAlpha = onMap ? 0.3 : 1;
  const halfW = w / 2 / (view.s * d), halfH = h / 2 / (view.s * d);
  for (let gx = Math.floor((view.x - halfW) / step) * step; gx < view.x + halfW; gx += step) { const [sx] = toScr(gx, 0); cx.strokeStyle = gx === 0 ? cGrid0 : cGrid; cx.beginPath(); cx.moveTo(sx + .5, 0); cx.lineTo(sx + .5, h); cx.stroke(); if (Math.round(gx / step) % 2 === 0) cx.fillText(Math.round(gx), sx + 3, 12 * d); }
  for (let gz = Math.floor((view.z - halfH) / step) * step; gz < view.z + halfH; gz += step) { const [, sy] = toScr(0, gz); cx.strokeStyle = gz === 0 ? cGrid0 : cGrid; cx.beginPath(); cx.moveTo(0, sy + .5); cx.lineTo(w, sy + .5); cx.stroke(); if (Math.round(gz / step) % 2 === 0) cx.fillText(Math.round(gz), 3, sy - 3); }
  cx.globalAlpha = 1;
  const colors = { 0: "#e8a33d", 1: "#d9c85a", 2: "#5fb0e8", 8: "#c98a4a", 9: "#9a9aa0" };
  for (const p of points()) {
    const [sx, sy] = toScr(p.x, p.z), on = p.i === sel;
    if (p.k === 2) { cx.beginPath(); cx.arc(sx, sy, Math.max(4 * d, p.r * view.s * d), 0, 7); cx.fillStyle = "rgba(95,176,232,.13)"; cx.fill(); cx.strokeStyle = colors[2]; cx.lineWidth = on ? 2.5 * d : 1.2 * d; cx.stroke(); }
    cx.beginPath();
    if (p.k >= 8) { cx.rect(sx - 5 * d, sy - 5 * d, 10 * d, 10 * d); } else cx.arc(sx, sy, 6 * d, 0, 7);
    cx.fillStyle = colors[p.k]; cx.fill(); cx.lineWidth = on ? 3 * d : 1 * d; cx.strokeStyle = on ? cAccent : cEdge; cx.stroke();
    if (p.yaw != null) { cx.beginPath(); cx.moveTo(sx, sy); cx.lineTo(sx + Math.sin(p.yaw) * 14 * d, sy + Math.cos(p.yaw) * 14 * d); cx.strokeStyle = colors[p.k]; cx.lineWidth = 2 * d; cx.stroke(); }
    cx.fillStyle = cText; cx.font = (on ? "600 " : "") + 12 * d + "px Segoe UI, sans-serif"; cx.fillText((p.i + 1) + (p.k === 9 ? " ⇢" : p.k === 8 ? " " + T("авто", "car") : ""), sx + 9 * d, sy - 7 * d);
  }
  if (live && live.inGame) {
    const [sx, sy] = toScr(live.x / 1000, live.z / 1000), a = live.yaw / 1000;
    cx.save(); cx.translate(sx, sy); cx.rotate(Math.PI - a); cx.beginPath(); cx.moveTo(0, -11 * d); cx.lineTo(7 * d, 8 * d); cx.lineTo(0, 4 * d); cx.lineTo(-7 * d, 8 * d); cx.closePath();
    cx.fillStyle = cOk; cx.fill(); cx.strokeStyle = cEdge; cx.lineWidth = d; cx.stroke(); cx.restore();
    cx.fillStyle = cOk; cx.font = "600 " + 12 * d + "px Segoe UI, sans-serif"; cx.fillText(T("Йорк", "York"), sx + 11 * d, sy + 4 * d);
  }
}
let drag = null;
cv.onmousedown = e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vz: view.z, moved: false }; cv.classList.add("drag"); };
window.onmousemove = e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; view.x = drag.vx - dx / view.s; view.z = drag.vz - dy / view.s; drawMap(); };
window.onmouseup = e => {
  if (!drag) return; cv.classList.remove("drag");
  if (!drag.moved) { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1, mx = (e.clientX - r.left) * d, my = (e.clientY - r.top) * d; let best = null, bd = 16 * d;
    for (const p of points()) { const [sx, sy] = toScr(p.x, p.z), dist = Math.hypot(sx - mx, sy - my); if (dist < bd) { bd = dist; best = p; } }
    if (best) select(best.i); }
  drag = null;
};
cv.onwheel = e => { e.preventDefault(); const k = e.deltaY < 0 ? 1.2 : 1 / 1.2; view.s = Math.min(8, Math.max(0.0005, view.s * k)); drawMap(); };

// ---------- wiring ----------
function renderAll() { renderSteps(); renderProps(); drawFlow(); drawMap(); }
$("lang").onclick = () => { EN = !EN; langPicked = EN ? "en" : "uk"; try { localStorage.setItem("ufx.lang", langPicked); } catch (e) {} applyLang(); renderAll(); setDirty(dirty); };
$("slot").onchange = e => { if (dirty && !confirm(T("Є незбережені зміни. Перейти до іншого слота без збереження?", "There are unsaved changes. Go to another slot without saving?"))) { e.target.value = slot; return; } loadSlot(parseInt(e.target.value)).then(fillSlots); };
$("save").onclick = save;
$("reload").onclick = () => { if (!dirty || confirm(T("Відкинути незбережені зміни?", "Discard the unsaved changes?"))) loadSlot(slot).then(fillSlots); };
$("run").onclick = async () => { if (needGame() && (!dirty || await save())) cmd("do=run&slot=" + slot); };
$("restart").onclick = async () => { if (needGame() && (!dirty || await save())) cmd("do=restart&slot=" + slot); };
$("stop").onclick = () => cmd("do=stop&slot=" + slot);
for (let k = 0; k < 4; ++k) $("add" + k).onclick = () => addStep(k);
$("del").onclick = removeStep; $("up").onclick = () => moveStep(-1); $("down").onclick = () => moveStep(1);
$("dup").onclick = () => { if (sel < 0 || Q.steps.length >= MAXSTEPS) return; shiftLinks(sel + 1, 1); Q.steps.splice(sel + 1, 0, JSON.parse(JSON.stringify(Q.steps[sel]))); sel++; setDirty(true); renderAll(); };
$("fit").onclick = fit;
$("follow").onclick = () => { if (!needGame()) return; view.x = live.x / 1000; view.z = live.z / 1000; drawMap(); };
$("export").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([toIni(Q)], { type: "text/plain" })); a.download = "mission" + slot + ".ini"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
$("import").onclick = () => $("file").click();
$("file").onchange = async e => { const f = e.target.files[0]; if (!f) return; Q = parseIni(decode(await f.arrayBuffer())); sel = -1; setDirty(true); renderAll(); fit(); e.target.value = ""; toast(T("Файл відкрито в цьому слоті: збережіть, щоб записати його у гру", "The file is open in this slot: save to write it into the game")); };
window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
new ResizeObserver(() => { sizeMap(); drawFlow(); }).observe($("mapwrap"));

$("setbtn").onclick = () => { fillSettings(); $("settings").classList.toggle("open"); };
document.addEventListener("mousedown", e => { if (!e.target.closest("#settings") && e.target.id !== "setbtn") $("settings").classList.remove("open"); });
$("setTheme").onchange = e => { SET.theme = e.target.value; saveSet(); applySet(); if (!SET.accent) $("setAccent").value = css("--accent"); };
$("setAccent").oninput = e => { SET.accent = e.target.value; saveSet(); applySet(); };
$("setAccentOff").onclick = () => { SET.accent = ""; saveSet(); applySet(); $("setAccent").value = css("--accent"); };
$("setMap").onchange = e => { SET.map = e.target.value; saveSet(); if (SET.map !== "grid" && online) loadTiles(); retint(); drawMap(); };
applySet();
applyLang(); fillSlots(); renderAll();
loadSlot(1).then(fillSlots);
poll(); setInterval(poll, 500);
</script>
